[package]
name = "buildkiosk"
description = "The BuildKiosk program: serve the web app, create a demo company, run commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "buildkiosk"
path = "src/main.rs"

# The QA bot's black-box regression suite (docs/qa.md): starts this program and drives it over HTTP. Its own
# `main` (no test harness); it runs only with BK_REGRESS=smoke or BK_REGRESS=release.
[[test]]
name = "regress"
path = "tests/regress/main.rs"
harness = false

[dependencies]
buildkiosk-core = { workspace = true }
buildkiosk-engine = { workspace = true }
buildkiosk-store = { workspace = true }
buildkiosk-server = { workspace = true }
buildkiosk-mcp = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
buildkiosk-regress-kit = { workspace = true }

[lints]
workspace = true
